<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Kayıt Sistemi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        form { display: grid; gap: 15px; }
        label { font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .delete-btn { background: #dc3545; }
        .delete-btn:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👤 Personel Kayıt Sistemi (Bulut - Supabase)</h1>
        
        <form id="personelForm">
            <div><label>Ad Soyad:</label><input type="text" id="adSoyad" required></div>
            <div><label>TC Kimlik No:</label><input type="text" id="tcNo" maxlength="11" required></div>
            <div><label>Departman:</label>
                <select id="departman" required>
                    <option value="">Seçiniz</option>
                    <option value="Yazılım">Yazılım</option>
                    <option value="Muhasebe">Muhasebe</option>
                    <option value="İK">İK</option>
                    <option value="Satış">Satış</option>
                    <option value="Pazarlama">Pazarlama</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            <div><label>Telefon:</label><input type="tel" id="telefon"></div>
            <div><label>E-posta:</label><input type="email" id="email"></div>
            <div><label>Başlangıç Tarihi:</label><input type="date" id="baslangicTarihi"></div>
            <div><label>Notlar:</label><textarea id="notlar" rows="3"></textarea></div>
            <button type="submit">✅ Personel Kaydet</button>
        </form>

        <h2>Kayıtlı Personel Listesi</h2>
        <table id="personelTable">
            <thead>
                <tr>
                    <th>Ad Soyad</th>
                    <th>TC No</th>
                    <th>Departman</th>
                    <th>Telefon</th>
                    <th>E-posta</th>
                    <th>Başlangıç Tarihi</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // === SUPABASE AYARLARINI BURAYA YAPIŞTIR ===
        const SUPABASE_URL = 'https://BURAYA-PROJE-URL-IN.supabase.co';
        const SUPABASE_ANON_KEY = 'BURAYA-ANON-PUBLIC-KEY-IN-YAPISTIR';

        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPersoneller() {
            const tbody = document.querySelector('#personelTable tbody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Yükleniyor...</td></tr>';

            const { data, error } = await supabase
                .from('personel')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="7" style="color:red;">Hata: Supabase ayarlarını kontrol edin.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Henüz kayıt yok.</td></tr>';
                return;
            }

            data.forEach(p => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${p.ad_soyad || ''}</td>
                    <td>${p.tc_no || ''}</td>
                    <td>${p.departman || ''}</td>
                    <td>${p.telefon || '-'}</td>
                    <td>${p.email || '-'}</td>
                    <td>${p.baslangic_tarihi || '-'}</td>
                    <td><button class="delete-btn" onclick="sil('${p.id}')">Sil</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        document.getElementById('personelForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const yeniPersonel = {
                ad_soyad: document.getElementById('adSoyad').value,
                tc_no: document.getElementById('tcNo').value,
                departman: document.getElementById('departman').value,
                telefon: document.getElementById('telefon').value,
                email: document.getElementById('email').value,
                baslangic_tarihi: document.getElementById('baslangicTarihi').value,
                notlar: document.getElementById('notlar').value
            };

            const { error } = await supabase.from('personel').insert([yeniPersonel]);
            if (error) {
                alert('Hata: ' + error.message);
            } else {
                alert('✅ Kayıt başarılı!');
                this.reset();
                loadPersoneller();
            }
        });

        window.sil = async function(id) {
            if (confirm('Bu personeli silmek istediğinizden emin misiniz?')) {
                const { error } = await supabase.from('personel').delete().eq('id', id);
                if (error) alert('Silme hatası: ' + error.message);
                else loadPersoneller();
            }
        };

        window.onload = loadPersoneller;
    </script>
</body>
</html>
