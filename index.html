<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Kayıt Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        form { display: grid; gap: 15px; }
        label { font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f8f9fa; }
        .delete-btn { background: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👤 Personel Kayıt Sistemi</h1>
        
        <form id="personelForm">
            <div>
                <label>Ad Soyad:</label>
                <input type="text" id="adSoyad" required>
            </div>
            <div>
                <label>TC Kimlik No:</label>
                <input type="text" id="tcNo" maxlength="11" required>
            </div>
            <div>
                <label>Departman:</label>
                <select id="departman" required>
                    <option value="">Seçiniz</option>
                    <option value="Yazılım">Yazılım</option>
                    <option value="Muhasebe">Muhasebe</option>
                    <option value="İK">İK</option>
                    <option value="Satış">Satış</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            <div>
                <label>Telefon:</label>
                <input type="tel" id="telefon">
            </div>
            <div>
                <label>E-posta:</label>
                <input type="email" id="email">
            </div>
            <div>
                <label>Başlangıç Tarihi:</label>
                <input type="date" id="baslangicTarihi">
            </div>
            <div>
                <label>Notlar:</label>
                <textarea id="notlar" rows="3"></textarea>
            </div>
            <button type="submit">✅ Personel Kaydet</button>
        </form>

        <h2>Kayıtlı Personel Listesi</h2>
        <table id="personelTable">
            <thead>
                <tr>
                    <th>Ad Soyad</th>
                    <th>TC No</th>
                    <th>Departman</th>
                    <th>Telefon</th>
                    <th>E-posta</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let personeller = JSON.parse(localStorage.getItem('personeller')) || [];

        function renderTable() {
            const tbody = document.querySelector('#personelTable tbody');
            tbody.innerHTML = '';

            personeller.forEach((p, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${p.adSoyad}</td>
                    <td>${p.tcNo}</td>
                    <td>${p.departman}</td>
                    <td>${p.telefon || '-'}</td>
                    <td>${p.email || '-'}</td>
                    <td><button class="delete-btn" onclick="sil(${index})">Sil</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        document.getElementById('personelForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const yeniPersonel = {
                adSoyad: document.getElementById('adSoyad').value,
                tcNo: document.getElementById('tcNo').value,
                departman: document.getElementById('departman').value,
                telefon: document.getElementById('telefon').value,
                email: document.getElementById('email').value,
                baslangicTarihi: document.getElementById('baslangicTarihi').value,
                notlar: document.getElementById('notlar').value
            };

            personeller.push(yeniPersonel);
            localStorage.setItem('personeller', JSON.stringify(personeller));

            alert('✅ Personel başarıyla kaydedildi!');
            this.reset();
            renderTable();
        });

        window.sil = function(index) {
            if (confirm('Bu personeli silmek istediğinizden emin misiniz?')) {
                personeller.splice(index, 1);
                localStorage.setItem('personeller', JSON.stringify(personeller));
                renderTable();
            }
        };

        // İlk yükleme
        renderTable();
    </script>
</body>
</html>
